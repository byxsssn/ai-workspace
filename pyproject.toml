[project]
name = "ai-workspace"
version = "0.1.0"
description = "支持用户自带 API 密钥的多模型聊天工作区"
readme = "README.md"
authors = [
    { name = "byxsss", email = "148875581+byxsssn@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1,<1",
    "httpx2>=2.12.0",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openrouter>=0.2.9,<0.3",
    "langgraph>=1.2.19,<2",
    "langsmith>=0.14.16,<0.15",
    "markdownify>=1.2.3",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
]

[project.scripts]
ai-workspace = "ai_workspace:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
backup = [
    "boto3>=1.43.113",
    "cryptography>=50.0.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
