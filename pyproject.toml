[project]
name = "ai-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "byxsss", email = "148875581+byxsssn@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
]

[project.scripts]
ai-workspace = "ai_workspace:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
