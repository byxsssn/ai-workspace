name: CI
on:
  pull_request:
  push:
    branches: [main, codex/first-deployment]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_workspace_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d ai_workspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_WORKSPACE_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/ai_workspace_test
      AI_WORKSPACE_JWT_SECRET_KEY: ci-only-not-a-production-jwt-secret-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked
      - name: Generate disposable test encryption key
        run: |
          uv run python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AI_WORKSPACE_CREDENTIAL_ENCRYPTION_KEY=' + Fernet.generate_key().decode() + '\n')
          PY
      - name: Backend checks and isolated database tests
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run alembic upgrade head
          uv run pytest -q
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Build production image
        run: docker build -t ai-workspace:ci .
      - name: Verify production image and migrations
        env:
          AI_WORKSPACE_REGISTRATION_INVITE_CODE: ci-only-not-a-production-invitation-123456
        run: |
          docker run --rm --network host \
            -e AI_WORKSPACE_DATABASE_URL -e AI_WORKSPACE_JWT_SECRET_KEY \
            -e AI_WORKSPACE_CREDENTIAL_ENCRYPTION_KEY -e AI_WORKSPACE_REGISTRATION_INVITE_CODE \
            ai-workspace:ci alembic upgrade head
          docker run -d --name production-smoke --network host \
            -e AI_WORKSPACE_DATABASE_URL -e AI_WORKSPACE_JWT_SECRET_KEY \
            -e AI_WORKSPACE_CREDENTIAL_ENCRYPTION_KEY -e AI_WORKSPACE_REGISTRATION_INVITE_CODE \
            ai-workspace:ci
          python scripts/check_deployment.py http://127.0.0.1:8000
      - name: Production image diagnostics
        if: failure()
        run: docker logs production-smoke 2>/dev/null || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f production-smoke 2>/dev/null || true
